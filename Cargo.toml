[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
backend-ffmpeg = { path = "crates/backend-ffmpeg" }
backend-filmcraft = { path = "crates/backend-filmcraft" }
backend-own = { path = "crates/backend-own" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# FilmCraft's pure-Rust codecs, pinned to upstream main of 2026-10-13 (the first revisions with
# `filmcraft-platform` are from 2026-10-10; EffectCraft still pins 2c5ba7a of 2026-10-03).
# Bump deliberately: the API moves (see docs/DESIGN.md "Pinning").
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "cee1feb185e675a108f78067f71ad86a640ace3d" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "cee1feb185e675a108f78067f71ad86a640ace3d" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "cee1feb185e675a108f78067f71ad86a640ace3d" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "cee1feb185e675a108f78067f71ad86a640ace3d" }
# OS hardware decoders (VideoToolbox / Media Foundation / NVDEC / VA-API); the one FilmCraft crate with FFI.
filmcraft-platform = { git = "https://github.com/storytold/filmcraft", rev = "cee1feb185e675a108f78067f71ad86a640ace3d" }

# Local co-development against a FilmCraft checkout next to this repo: uncomment.
# [patch."https://github.com/storytold/filmcraft"]
# filmcraft-codecs = { path = "../filmcraft/crates/codecs" }
# filmcraft-media = { path = "../filmcraft/crates/media" }
# filmcraft-frame = { path = "../filmcraft/crates/frame" }
# filmcraft-time = { path = "../filmcraft/crates/time" }
# filmcraft-platform = { path = "../filmcraft/crates/platform" }

[profile.release]
debug = 1

# Decoder hot loops are unusable at opt-level 0; the harness itself is light.
[profile.dev.package."*"]
opt-level = 3
