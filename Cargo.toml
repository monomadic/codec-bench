[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
backend-ffmpeg = { path = "crates/backend-ffmpeg" }
backend-filmcraft = { path = "crates/backend-filmcraft" }
backend-own = { path = "crates/backend-own" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# FilmCraft's pure-Rust codecs, pinned to the revision EffectCraft uses (2026-10-03).
# Bump deliberately: the API moves (see docs/DESIGN.md "Pinning").
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }

# Local co-development against a FilmCraft checkout next to this repo: uncomment.
# [patch."https://github.com/storytold/filmcraft"]
# filmcraft-codecs = { path = "../filmcraft/crates/codecs" }
# filmcraft-media = { path = "../filmcraft/crates/media" }
# filmcraft-frame = { path = "../filmcraft/crates/frame" }
# filmcraft-time = { path = "../filmcraft/crates/time" }

[profile.release]
debug = 1

# Decoder hot loops are unusable at opt-level 0; the harness itself is light.
[profile.dev.package."*"]
opt-level = 3
