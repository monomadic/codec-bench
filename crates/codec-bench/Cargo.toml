[package]
name = "codec-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless decoder benchmark and conformance runner: ffmpeg vs FilmCraft vs your own decoders"

[[bin]]
name = "codec-bench"
path = "src/main.rs"

[features]
default = ["ffmpeg", "filmcraft", "own"]
ffmpeg = ["dep:backend-ffmpeg"]
libav = ["ffmpeg", "backend-ffmpeg/libav"]
filmcraft = ["dep:backend-filmcraft"]
filmcraft-hw = ["filmcraft", "backend-filmcraft/hw"]
own = ["dep:backend-own"]

[dependencies]
harness-core = { workspace = true }
backend-ffmpeg = { workspace = true, optional = true }
backend-filmcraft = { workspace = true, optional = true }
backend-own = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
chrono = { workspace = true }
